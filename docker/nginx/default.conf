map $http_x_forwarded_proto $notes_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https://github.com https://raw.githubusercontent.com https://ghfast.top https://gh-proxy.com https://ghproxy.net https://github.moeyy.xyz https://gh.llkk.cc https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $notes_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /images/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $notes_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
  }

  # 旧版七牛同源代理已无业务使用。保留会把用户上传的 SVG 变成应用同源脚本，
  # 直接返回 404，避免形成存储型 XSS。
  location /qiniu/ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
